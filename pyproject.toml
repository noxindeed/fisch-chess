[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fisch-chess"
version = "0.1.0"
description = "A lightweight terminal chess game written in Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fisch = "src.main:main"

[tool.setuptools]
packages = ["src"]